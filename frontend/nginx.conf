server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. It matters together with the variables below: with
    # a literal host name in proxy_pass, nginx resolves the upstream once at
    # startup and caches that address for the life of the process, so every
    # rebuild of the api container gives the new container a new address and
    # turns this into a 502 until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # the SPA is one page; unknown paths still serve it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API lives in another container. Proxying it here keeps the browser on
    # a single origin, so the app needs no CORS and no absolute URLs.
    location /api/ {
        # a variable in proxy_pass is what forces re-resolution per request;
        # it also means the request URI has to be passed on explicitly
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stats {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Device sockets are write-only: nothing comes back for minutes at a
        # time, and the 60s default would drop them as idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
